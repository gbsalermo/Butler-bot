name: Apply course navigation fix v2

on:
  push:
    branches: [fix/course-navigation-buttons]
    paths:
      - '.github/workflows/apply-course-navigation-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest 'pypdf>=5,<7'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('cloudflare/src/course_operational.py')
          text = path.read_text(encoding='utf-8')

          old = '''# O arquivo 🗄 normalmente chega do Telegram com U+FE0F (variation selector).\n# Aceitamos ambas as formas sem contaminar o ID/texto persistido.\nCOURSE_BUTTON_RE = re.compile(r"^(?:📘|🗄\\ufe0f?)\\s+#(\\d+)\\b")\nMODULE_BUTTON_RE = re.compile(r"^🧩\\s+#(\\d+)\\b")\nCONTENT_BUTTON_RE = re.compile(r"^📄\\s+#(\\d+)\\b")\n'''
          new = '''# Reply keyboards podem devolver variation selector (U+FE0F) e NBSP mesmo\n# quando o texto visual é idêntico ao enviado. Normalize antes de extrair IDs.\nCOURSE_BUTTON_RE = re.compile(r"^(?:📘|🗄)\\s*#(\\d+)(?:\\s|$)")\nMODULE_BUTTON_RE = re.compile(r"^🧩\\s*#(\\d+)(?:\\s|$)")\nCONTENT_BUTTON_RE = re.compile(r"^📄\\s*#(\\d+)(?:\\s|$)")\n\n\ndef _button_text(text):\n    value = str(text or "").replace("\\ufe0f", "").replace("\\u00a0", " ")\n    return " ".join(value.split()).strip()\n'''
          if old not in text:
              raise SystemExit('regex block not found')
          text = text.replace(old, new, 1)

          old = '''def _course_id_from_text(text):\n    match = COURSE_BUTTON_RE.match(text or "")\n    return int(match.group(1)) if match else None\n\n\ndef _module_id_from_text(text):\n    match = MODULE_BUTTON_RE.match(text or "")\n    return int(match.group(1)) if match else None\n\n\ndef _content_id_from_text(text):\n    match = CONTENT_BUTTON_RE.match(text or "")\n    return int(match.group(1)) if match else None\n'''
          new = '''def _course_id_from_text(text):\n    match = COURSE_BUTTON_RE.match(_button_text(text))\n    return int(match.group(1)) if match else None\n\n\ndef _module_id_from_text(text):\n    match = MODULE_BUTTON_RE.match(_button_text(text))\n    return int(match.group(1)) if match else None\n\n\ndef _content_id_from_text(text):\n    match = CONTENT_BUTTON_RE.match(_button_text(text))\n    return int(match.group(1)) if match else None\n'''
          if old not in text:
              raise SystemExit('parser block not found')
          text = text.replace(old, new, 1)

          marker = '''    if state == "course_create_title":\n'''
          nav = '''    # Navegação de nível superior deve funcionar em qualquer tela/wizard de Cursos.\n    # Isso também permite recuperar a interface caso um teclado antigo permaneça aberto.\n    if text in {"📘 Cursos", "⬅️ Voltar aos cursos"}:\n        await app.clear_state(db, uid)\n        await _show_course_menu(token, chat_id)\n        return True\n    if text == "📚 Meus cursos":\n        await app.clear_state(db, uid)\n        await _show_course_list(db, token, chat_id, uid)\n        return True\n    if text == "🗄️ Cursos arquivados":\n        await app.clear_state(db, uid)\n        await _show_course_list(db, token, chat_id, uid, archived=True)\n        return True\n    if text == "🏠 Menu principal":\n        await app.clear_state(db, uid)\n        await _send(token, chat_id, "🏠 Menu principal", app.MAIN_KB)\n        return True\n\n'''
          if marker not in text:
              raise SystemExit('state marker not found')
          text = text.replace(marker, nav + marker, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('cloudflare/tests/test_course_navigation_buttons.py')
          test.write_text('''import asyncio\n\nimport course_operational\n\n\ndef test_dynamic_course_buttons_accept_telegram_unicode_variants():\n    assert course_operational._course_id_from_text("📘\\ufe0f\\u00a0#7 Curso") == 7\n    assert course_operational._course_id_from_text("🗄️\\u00a0#8 Arquivado") == 8\n    assert course_operational._module_id_from_text("🧩\\ufe0f\\u00a0#2 Módulo") == 2\n    assert course_operational._content_id_from_text("📄\\ufe0f\\u00a0#31 Aula") == 31\n\n\ndef test_top_level_course_navigation_works_from_nested_state(monkeypatch):\n    async def scenario():\n        calls = []\n\n        async def fake_clear(db, uid):\n            calls.append(("clear", uid))\n\n        async def fake_list(db, token, chat_id, uid, archived=False):\n            calls.append(("list", uid, archived))\n\n        monkeypatch.setattr(course_operational.app, "clear_state", fake_clear)\n        monkeypatch.setattr(course_operational, "_show_course_list", fake_list)\n\n        handled = await course_operational._handle_state(\n            object(), "token", 123, 10, "📚 Meus cursos", "course_modules", {"course_id": 99}\n        )\n        assert handled is True\n        assert calls == [("clear", 10), ("list", 10, False)]\n\n    asyncio.run(scenario())\n''', encoding='utf-8')
      - name: Run focused tests
        working-directory: cloudflare
        run: |
          python -m py_compile src/course_operational.py
          pytest -q tests/test_course_navigation_buttons.py tests/test_stage4_3_course_progress.py tests/test_stage4_5_course_import.py
      - name: Remove temporary workflows
        run: rm .github/workflows/apply-course-navigation-fix.yml .github/workflows/apply-course-navigation-fix-v2.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/src/course_operational.py cloudflare/tests/test_course_navigation_buttons.py .github/workflows/apply-course-navigation-fix.yml .github/workflows/apply-course-navigation-fix-v2.yml
          git commit -m 'fix: make course navigation buttons resilient'
          git push
