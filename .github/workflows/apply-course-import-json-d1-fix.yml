name: Apply course import JSON D1 fix

on:
  push:
    branches:
      - fix/course-import-free-d1-limit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-import-free-d1-limit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest "pypdf>=5,<7"

      - name: Apply patch
        run: python tools/apply_course_import_json_d1_fix.py

      - name: Run focused tests
        working-directory: cloudflare
        run: |
          python -m py_compile src/course_domain.py src/course_importer.py src/course_stage4.py
          python -m pytest tests/test_stage4_5_course_import.py -q

      - name: Remove temporary files
        run: |
          rm -f tools/apply_course_import_json_d1_fix.py
          rm -f .github/workflows/apply-course-import-json-d1-fix.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reduce course import to a few D1 queries"
          git push origin HEAD:fix/course-import-free-d1-limit
