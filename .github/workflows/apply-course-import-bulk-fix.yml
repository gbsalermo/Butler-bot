name: Apply large course import fix

on:
  push:
    branches:
      - fix/course-import-confirm-large

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/course-import-confirm-large
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_course_import_bulk_fix.py

      - name: Run focused tests
        working-directory: cloudflare
        run: |
          python -m pip install -q pytest pypdf
          python -m py_compile src/course_domain.py src/course_importer.py src/course_stage4.py
          pytest -q tests/test_stage4_5_course_import.py tests/test_course_import_preview_limit.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist large course imports in bulk"
          git push origin HEAD:fix/course-import-confirm-large
